<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청첩장 시안</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+KR:wght@300;400;600&family=Cinzel:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px; /* 화면 미리보기용 여백 */
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            font-family: 'Noto Serif KR', serif;
            color: #333;
        }
        .page {
            width: 100mm;
            height: 148mm;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. 앞면 (Front Page) 스타일 */
        .front-page {
            padding: 0; /* 테두리 없이 사진으로 꽉 채움 */
        }
        .front-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transform: scale(1.1);
            z-index: 1;
        }
        .front-content {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10mm 0 10mm 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.3) 100%);
        }
        .front-script {
            font-family: 'Great Vibes', cursive;
            color: #fce4ec; /* 연한 핑크톤 */
            font-size: 45pt;
            line-height: 1.1;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .front-script-line1 {
            transform: translateX(-18px) rotate(-7deg);
            margin-left:-20px;
        }
        .front-script-line2 {
            transform: translateX(18px) rotate(-7deg);
            margin-top: -5px;
            margin-left: 100px;
        }
        .front-names {
            font-family: 'Cinzel', serif;
            color: #fce4ec;
            font-size: 9pt;
            font-weight: 580;
            text-align: center;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: 25px;
        }
        .name-part {
            letter-spacing: 8px;
        }
        .amp-part {
            margin-left: 3px;
            margin-right: 11px;
        }

        /* 2. 뒷면 (Back Page) 스타일 */
        .back-page {
            text-align: center;
            padding: 12mm 10mm;
            background-color: #fff;
            justify-content: space-between; /* 요소들을 세로로 고르게 분배 */
        }
        .back-header {
            font-family: 'Great Vibes', cursive;
            color: #6a8caf; /* 샘플의 파스텔 블루 */
            font-size: 20pt;
        }
        .greeting {
            font-size: 8pt;
            line-height: 1.8;
            color: #444;
        }
        .divider-icon {
            font-size: 10pt;
            color: #bbb;
        }
        .date-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5mm;
        }
        .date-item {
            font-size: 11pt;
            font-weight: 600;
            color: #222;
        }
        .date-sep {
            width: 1px;
            height: 12px;
            background-color: #ddd;
        }
        .location-info {
            font-size: 8.5pt;
            font-weight: 600;
            line-height: 1.6;
        }
        .location-addr {
            font-size: 7.5pt;
            font-weight: 400;
            color: #666;
        }
        .parents-block {
            font-size: 8.5pt;
            line-height: 2;
        }
        .parents-relation {
            font-size: 7pt;
            color: #888;
            margin: 0 2px;
        }
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-img {
            width: 20mm;
            height: 20mm;
            margin-bottom: 2mm;
            object-fit: contain;
        }
        .qr-text {
            font-size: 6.5pt;
            color: #666;
            letter-spacing: -0.5px;
        }

        /* 인쇄(PDF 추출) 설정 */
        @media print {
            body { padding: 0; background-color: white; gap: 0; display: block; }
            .page { box-shadow: none; page-break-after: always; }
            .page:last-child { page-break-after: auto; }
            @page { size: 100mm 148mm; margin: 0; }
        }
    </style>
</head>
<body>

    <!-- 1페이지: 앞면 -->
    <div class="page front-page">
        <!-- 배경 사진 꽉 채우기 -->
        <img src="photo.jpg" alt="" class="front-bg" onerror="this.style.display='none'">
        
        <div class="front-content">
            <!-- 윗부분 영문 스크립트 -->
            <div class="front-script">
                <span class="front-script-line1">We're getting</span>
                <span class="front-script-line2">Married!</span>
            </div>
            
            <!-- 아랫부분 이름 -->
            <div class="front-names">
                <span class="name-part">CHANHYUN</span>
                <span class="amp-part">&amp;</span>
                <span class="name-part">HANBI</span>
            </div>
        </div>
    </div>

    <!-- 2페이지: 뒷면 -->
    <div class="page back-page">
        <div class="back-header">Wedding Invitation</div>

        <div class="greeting">
            캠퍼스 강의실에서 시작된 저희의 인연이<br>
            이제는 같은 회사에서 가장 든든한 동료이자<br>
            평생의 반려자가 되려 합니다.<br>
            새로운 인생이라는 가장 큰 프로젝트를 시작하는 자리에<br>
            소중한 분들을 모시오니 따뜻하게 축복해 주시면 감사하겠습니다.
        </div>
        
        <!-- 중앙 장식 -->
        <div class="divider-icon">❦</div>

        <div class="date-row">
            <div class="date-item">10월 31일</div>
            <div class="date-sep"></div>
            <div class="date-item">토요일</div>
            <div class="date-sep"></div>
            <div class="date-item">낮 12시</div>
        </div>

        <div class="location-info">
            건국대학교 동문회관 (KU 컨벤션 웨딩홀)<br>
            <span class="location-addr">서울 광진구 아차산로36길 5</span>
        </div>

        <div class="parents-block">
            이명수 · 김지윤 <span class="parents-relation">의 아들</span> 이찬현<br>
            김영택 · 이시은 <span class="parents-relation">의 딸</span> 김한비
        </div>

        <div class="qr-section">
            <img src="site-qr.svg" alt="" class="qr-img" onerror="this.style.display='none'">
            <div class="qr-text">모바일 청첩장</div>
        </div>
    </div>

</body>
</html>
